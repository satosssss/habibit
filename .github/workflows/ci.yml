name: CI

on:
  pull_request:
  push:
    branches: [main]

# A new push supersedes the old run on the same branch; don't burn minutes on
# a commit nobody will look at again.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  verify:
    name: typecheck · lint · test · build
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      # package-lock.json is committed; `ci` fails on drift instead of
      # silently installing a different tree than the one tested locally.
      - run: npm ci

      - run: npm run typecheck

      - run: npm run lint

      # Vitest pins TZ=America/Los_Angeles itself (vitest.config.ts), so date
      # assertions behave the same here as on a developer machine.
      - run: npm test

      # Dummy auth values: the build only needs them to exist so the Auth.js
      # route handler can be type-checked and collected. No real secrets, and
      # nothing here is used at runtime.
      - run: npm run build
        env:
          AUTH_SECRET: ci-placeholder-secret-not-used-at-runtime
          AUTH_GOOGLE_ID: ci-placeholder-id
          AUTH_GOOGLE_SECRET: ci-placeholder-secret
